# Builds the desktop app for Windows, macOS and Linux.
# - Every push that touches the app shell: installers are attached to the run as artifacts (Actions tab).
# - A pushed tag like v1.0.0, or "Run workflow" on the Actions tab: the installers are also published
#   as a GitHub Release (tagged v<version from package.json> when started by hand).
name: Desktop app

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "desktop/**"
      - "server/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      # macOS refuses an app whose signature is missing or broken ("is damaged and can't be opened"),
      # so the ad-hoc signature (package.json: mac.identity "-") has to hold for the whole bundle
      - name: Check the signature (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Maturita z matematiky.app"
          codesign -dv "dist/mac-universal/Maturita z matematiky.app" 2>&1 | grep -E "Signature|flags"
      # start the packaged app: it has to show the page and reach its database (desktop/main.js, MATURITA_SMOKE)
      - name: Start the packaged app
        shell: bash
        timeout-minutes: 3
        env:
          MATURITA_SMOKE: "1"
          MATURITA_DATA_DIR: ${{ runner.temp }}/smoke-data
        run: |
          case "$RUNNER_OS" in
            macOS)   "dist/mac-universal/Maturita z matematiky.app/Contents/MacOS/Maturita z matematiky" ;;
            Windows) "dist/win-unpacked/Maturita z matematiky.exe" ;;
            Linux)   xvfb-run -a dist/linux-unpacked/maturita-tracker --no-sandbox ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: Maturita-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  # one job gathers all three builds into a single release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Maturita z matematiky ${{ steps.version.outputs.tag }}
          body: |
            Stiahni súbor pre svoj systém:
            - **Windows** — `Maturita-…-Windows.exe` (ak sa objaví „Windows protected your PC“: *More info → Run anyway*)
            - **macOS** — `Maturita-…-macOS.dmg` (prvýkrát: otvor ju, potom *System Settings → Privacy & Security → Open Anyway*)
            - **Linux** — `Maturita-…-Linux.AppImage` (`chmod +x`, potom spustiť)
          files: dist/*

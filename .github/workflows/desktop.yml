# Builds the desktop app for Windows, macOS and Linux.
# - Every push that touches the app shell: installers are attached to the run as artifacts (Actions tab).
# - A pushed tag like v1.0.0: the installers are also published as a GitHub Release.
# - "Run workflow" on the Actions tab builds them on demand.
name: Desktop app

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "desktop/**"
      - "server/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Maturita-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
